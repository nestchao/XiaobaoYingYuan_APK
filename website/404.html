<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100svh; padding: 24px; }

    .nf p { margin: 18px 0 30px; color: var(--text-2); font-size: 15px; line-height: 1.8; }
    .nf .btn { margin: 0 auto; }
  </style>

    <img src="assets/img/brand/icon-192.png" alt="小宝影院" />
